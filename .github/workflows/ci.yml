name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ayni dal icin ust uste iten commitlerde onceki calismayi iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # NOT: package.json'daki xlsx bagimliligi npm registry'den degil SheetJS
      # CDN tarball'indan geliyor (registry surumu terk edilmis ve iki HIGH
      # severity acigi var). npm ci bunu cekebilmeli.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Renderer + Electron ana surec derlemesi. Ortam degiskeni gerekmiyor:
      # VITE_* degerleri yalnizca calisma zamaninda okunuyor, derleme
      # bunlarsiz da tamamlaniyor.
      - name: Build
        run: npm run build
