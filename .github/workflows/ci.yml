name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ayni dal icin ust uste iten commitlerde onceki calismayi iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# src/lib/supabase.ts, VITE_SUPABASE_* eksikse MODUL YUKLENIRKEN hata firlatir
# (Sprint 0.2; sessizce yanlis calismak yerine erken ve acik hata). Testler
# yalnizca saf fonksiyonlari dogruluyor ama import zinciri
# productLookup.test.ts -> productLookup.ts -> supabase.ts oldugu icin bu hata
# CI'da testleri dusuruyordu. Asagidaki degerler yalnizca modulun kurulabilmesi
# icin var; hicbir test ag cagrisi yapmiyor. GERCEK ANAHTAR DEGIL.
env:
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # NOT: package.json'daki xlsx bagimliligi npm registry'den degil SheetJS
      # CDN tarball'indan geliyor (registry surumu terk edilmis ve iki HIGH
      # severity acigi var). npm ci bunu cekebilmeli.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
